name: CI

on:
  push:
    branches: [main, fix/ux-repairs-combined]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app (app/) and sync server (server/) land on main via separate PR
# chains. Each job no-ops until its directory exists on the branch.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('app/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        if: hashFiles('app/package.json') != ''
        run: npm ci
      - name: Run tests
        if: hashFiles('app/package.json') != ''
        run: npm test
      - name: Build
        if: hashFiles('app/package.json') != ''
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('server/requirements-dev.txt') != ''
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: hashFiles('server/requirements-dev.txt') != ''
        run: pip install -r requirements-dev.txt
      - name: Run tests
        if: hashFiles('server/requirements-dev.txt') != ''
        run: pytest
