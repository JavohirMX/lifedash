name: CI

on:
  push:
    branches: [main, fix/ux-repairs-combined]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app (app/) and sync server (server/) land on main via separate PR
# chains. Each job no-ops until its directory exists on the branch.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('app/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        if: hashFiles('app/package.json') != ''
        run: npm ci
      - name: Run tests
        if: hashFiles('app/package.json') != ''
        run: npm test
      - name: Build
        if: hashFiles('app/package.json') != ''
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
