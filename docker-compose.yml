# Lifedash: app frontend + sync server.
#
#   docker compose up --build
#
# Then open http://localhost:8080 and, in the app, point Settings -> Sync
# at http://localhost:8787.
services:
  app:
    build: ./app
    ports:
      - "8080:80"
    restart: unless-stopped

  sync:
    build: ./server
    ports:
      - "8787:8787"
      # Internet-facing setup: terminate TLS at a reverse proxy and keep
      # the sync server private to the host instead of the line above:
      # - "127.0.0.1:8787:8787"
      # See docs/self-host-hardening.md.
    volumes:
      - sync-data:/data
    restart: unless-stopped

volumes:
  sync-data:
